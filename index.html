<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판굿 진법 플레이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one dark stage, controls directly under it within thumb reach; side panel on wide screens. Single theme by choice. */
:root{
  color-scheme:dark;
  --ink:#14151a;          /* page */
  --floor:#1c1e25;        /* stage floor, panels */
  --line:#30333d;         /* hairlines, grid */
  --text:#eceae4;
  --muted:#9a9ca6;
  --accent:#ef5a3c;       /* 오방 red, used for the playhead and active state */
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:14px 16px 28px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;letter-spacing:.01em}
header span{color:var(--muted);font-size:12px;white-space:nowrap}

.stagewrap{position:relative;background:var(--floor);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;touch-action:manipulation}
.now{position:absolute;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.now b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.15}
.now small{display:block;color:var(--muted);font-size:12px;min-height:17px}
.now time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px}

.transport{display:grid;gap:10px}
.scrub{position:relative;height:34px}
.scrub canvas{position:absolute;inset:0;height:34px;border-radius:6px}
.scrub input{position:absolute;inset:0;width:100%;height:34px;margin:0;opacity:0;cursor:pointer}
.buttons{display:flex;align-items:center;gap:8px}
.btn{height:44px;min-width:44px;padding:0 12px;border-radius:10px;background:var(--floor);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.btn:active{background:var(--line)}
.btn.play{background:var(--accent);border-color:var(--accent);color:#1a0d08;min-width:64px;font-weight:600}
.btn svg{width:18px;height:18px;fill:currentColor}
.grow{flex:1}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:none;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--floor);font-size:13px;white-space:nowrap;color:var(--muted)}
.chip[aria-current="true"]{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:600}

h2{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 8px;letter-spacing:.04em}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.who{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--floor);display:flex;align-items:center;gap:8px;padding:0 8px;font-size:14px;text-align:left}
.who i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;color:#14151a;font-variant-numeric:tabular-nums}
.who[aria-pressed="true"]{border-color:var(--text);background:#262933}
.roster.some .who[aria-pressed="false"]{opacity:.5}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts .btn{height:38px;font-size:13px}
.hint{color:var(--muted);font-size:12px;margin:8px 0 0}

@media (min-width:860px){
  .app{grid-template-columns:minmax(0,1fr) 300px;column-gap:24px;align-items:start}
  header{grid-column:1/-1}
  .main{display:grid;gap:14px;grid-column:1;grid-row:2}
  .chipsrow{grid-column:1;grid-row:3;min-width:0}
  .side{display:grid;gap:22px;grid-column:2;grid-row:2/span 2;position:sticky;top:14px}
}
@media (max-width:859px){.main,.side{display:contents}}
</style>
</head>
<body>
<div class="app">
  <header><h1>판굿 진법 플레이어</h1><span id="meta"></span></header>

  <div class="main">
    <div class="stagewrap">
      <canvas id="stage" aria-label="무대 대형. 점을 누르면 그 사람의 동선을 표시합니다."></canvas>
      <div class="now"><div><b id="sec">어르기</b><small id="step"></small></div><time id="clock">0:00 / 2:06</time></div>
    </div>

    <div class="transport">
      <div class="scrub"><canvas id="bar"></canvas><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="재생 위치"></div>
      <div class="buttons">
        <button class="btn" id="prev" aria-label="이전 대형"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="btn play" id="play" aria-label="재생"><svg id="playicon" viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg></button>
        <button class="btn" id="next" aria-label="다음 대형"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
        <span class="grow"></span>
        <button class="btn" id="speed" aria-label="재생 속도">1×</button>
      </div>
    </div>
  </div>

  <div class="chipsrow"><div class="chips" id="chips" role="list" aria-label="가락"></div></div>

  <div class="side">
    <section>
      <h2>치배 · 누르면 동선과 진행 방향 표시</h2>
      <div class="roster" id="roster"></div>
    </section>
    <section>
      <h2>보기</h2>
      <div class="opts">
        <button class="btn" id="oNames" aria-pressed="true">이름</button>
        <button class="btn" id="oTrail" aria-pressed="false">모든 동선</button>
        <button class="btn" id="oZoom" aria-pressed="false">가까이 보기</button>
        <button class="btn" id="oFlip" aria-pressed="false">청중 쪽에서 보기</button>
      </div>
      <p class="hint">스페이스: 재생/정지 · ←/→: 이전/다음 대형</p>
    </section>
  </div>
</div>

  const order=D.dancers.map((d,k)=>k).sort((a,b)=>(sel.has(a)-sel.has(b))||(b-a));
  lastPts=[];
  g.textAlign='center';
  for(const k of order){
    const d=D.dancers[k],[x,y]=P[k],X=sx(x),Y=sy(y),on=!any||sel.has(k);
    lastPts.push([k,X,Y]);
    g.globalAlpha=on?1:.28;
    g.beginPath();g.arc(X,Y,r+2.5,0,7);g.fillStyle='rgba(20,21,26,.75)';g.fill();
    g.beginPath();g.arc(X,Y,r,0,7);g.fillStyle=PAL[d.c];g.fill();
    if(any&&sel.has(k)){g.lineWidth=2;g.strokeStyle=C.text;g.beginPath();g.arc(X,Y,r+3.5,0,7);g.stroke();
      // heading arrow: where this person is moving over the next ~0.4s (hidden while standing still)
      const [x2,y2]=pos(k,Math.min(LAST,t+6),false),dx=sx(x2)-X,dy=sy(y2)-Y,len=Math.hypot(dx,dy);
      if(len>scale*0.06){const ux=dx/len,uy=dy/len,b0=r+6.5,tip=r+6.5+Math.max(12,r*1.1),hw=Math.max(7.5,r*.7);
        g.beginPath();g.moveTo(X+ux*tip,Y+uy*tip);g.lineTo(X+ux*b0-uy*hw,Y+uy*b0+ux*hw);g.lineTo(X+ux*b0+uy*hw,Y+uy*b0-ux*hw);g.closePath();
        g.fillStyle=C.text;g.fill();g.lineWidth=1.5;g.strokeStyle='rgba(20,21,26,.9)';g.stroke();}
    }
    g.fillStyle='#14151a';g.font='600 '+Math.round(r*1.05)+'px '+css('--body');g.textBaseline='middle';
    g.fillText(d.id,X,Y+.5);
    if(opt.names&&(on)&&(scale>=24||sel.has(k))){
      g.font='500 '+Math.max(10,Math.round(r*.9))+'px '+css('--body');g.textBaseline='top';
      g.lineWidth=3;g.strokeStyle='rgba(28,30,37,.85)';g.strokeText(d.name,X,Y+r+3);
      g.fillStyle=C.text;g.fillText(d.name,X,Y+r+3);
    }
  }
  g.globalAlpha=1;
  hud();
}

// ---------- HUD, chips, bar ----------
let lastSec=-1,lastStep=-1;
const fmt=f=>{const s=Math.floor(f/FPS);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function hud(){
  const si=idxAt(D.sections,t), st=idxAt(D.steps,t);
  if(si!==lastSec){lastSec=si;$('sec').textContent=D.sections[si][1];
    [...$('chips').children].forEach((c,i)=>c.setAttribute('aria-current',i===si));
    const c=$('chips').children[si],box=$('chips');
    if(c) box.scrollTo({left:c.offsetLeft-box.clientWidth/2+c.clientWidth/2,behavior:reduced?'auto':'smooth'});
  }
  if(st!==lastStep){lastStep=st;const l=D.steps[st][1];$('step').textContent=(l===D.sections[si][1]?'':l+' · ')+(st+1)+' / '+D.steps.length;}
  $('clock').textContent=fmt(t)+' / '+fmt(LAST);
  $('seek').value=Math.round(t/LAST*1000);
  $('seek').setAttribute('aria-valuetext',D.sections[si][1]+' '+fmt(t));
  drawBar();
}
function drawBar(){
  const b=$('bar'),c=b.getContext('2d'),w=b.width/dpr,h=34;
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  const si=idxAt(D.sections,t);
  D.sections.forEach((s,i)=>{
    const a=s[0]/LAST*w,e=(i+1<D.sections.length?D.sections[i+1][0]:LAST)/LAST*w;
    c.fillStyle=i===si?'#4a4e5c':(i%2?'#262933':'#30333d');
    c.fillRect(a+.5,10,Math.max(1,e-a-1),14);
  });
  c.fillStyle='rgba(236,234,228,.28)';
  for(const s of D.steps){c.fillRect(s[0]/LAST*w,20,1,4);}
  const x=t/LAST*w;
  c.fillStyle=C.accent;c.fillRect(Math.max(0,Math.min(w-3,x-1.5)),4,3,26);
  c.beginPath();c.arc(Math.max(5,Math.min(w-5,x)),5,5,0,7);c.fill();
}

// ---------- playback ----------
let lastTs=0;
function tick(ts){
  if(!playing)return;
  const dt=Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
  t+=dt*FPS*speed;
  if(t>=LAST){t=LAST;setPlaying(false);}
  draw();
  if(playing)requestAnimationFrame(tick);
}
function setPlaying(p){
  if(p&&t>=LAST)t=0;
  playing=p;
  $('playicon').innerHTML=p?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4l14 8-14 8z"/>';
  $('play').setAttribute('aria-label',p?'정지':'재생');
  if(p){lastTs=performance.now();requestAnimationFrame(tick);}else draw();
}
function seek(f){t=Math.max(0,Math.min(LAST,f));if(!playing){view.cx=view.cx;}draw();}
function stepBy(dir){
  const i=idxAt(D.steps,t);
  let j=dir>0?i+1:(t-D.steps[i][0]>FPS*.4?i:i-1);
  j=Math.max(0,Math.min(D.steps.length-1,j));
  // land where the formation has settled: just before the next label starts
  seek(settle(j));
}
function settle(j){const a=D.steps[j][0],b=j+1<D.steps.length?D.steps[j+1][0]:LAST;return j===0?a:Math.min(b-1,a+Math.max(1,(b-a)*.6));}

$('play').onclick=()=>setPlaying(!playing);
$('prev').onclick=()=>{setPlaying(false);stepBy(-1)};
$('next').onclick=()=>{setPlaying(false);stepBy(1)};
$('speed').onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];$('speed').textContent=speed+'×';};
$('seek').oninput=e=>seek(e.target.value/1000*LAST);
addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}
  else if(e.code==='ArrowRight'&&e.target.id!=='seek'){setPlaying(false);stepBy(1);}
  else if(e.code==='ArrowLeft'&&e.target.id!=='seek'){setPlaying(false);stepBy(-1);}
});

// section chips
D.sections.forEach((s,i)=>{
  const b=document.createElement('button');b.className='chip';b.textContent=s[1];b.setAttribute('role','listitem');
  b.onclick=()=>seek(s[0]);$('chips').appendChild(b);
});
// roster
D.dancers.forEach((d,k)=>{
  const b=document.createElement('button');b.className='who';b.setAttribute('aria-pressed','false');
  b.innerHTML='<i style="background:'+PAL[d.c]+'">'+d.id+'</i><span>'+d.name+'</span>';
  b.onclick=()=>toggle(k);$('roster').appendChild(b);
});
function toggle(k){
  sel.has(k)?sel.delete(k):sel.add(k);
  [...$('roster').children].forEach((b,i)=>b.setAttribute('aria-pressed',sel.has(i)));
  $('roster').classList.toggle('some',sel.size>0);
  draw();
}
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  let best=-1,bd=26*26;
  for(const [k,X,Y] of lastPts){const d=(X-x)**2+(Y-y)**2;if(d<=bd){bd=d;best=k;}}
  if(best>=0)toggle(best);else if(sel.size){sel.clear();toggle(-1);sel.delete(-1);[...$('roster').children].forEach(b=>b.setAttribute('aria-pressed','false'));$('roster').classList.remove('some');draw();}
});
// options
for(const [id,key] of [['oNames','names'],['oTrail','trail'],['oZoom','zoom'],['oFlip','flip']]){
  $(id).onclick=()=>{opt[key]=!opt[key];$(id).setAttribute('aria-pressed',opt[key]);
    if(key==='zoom'||key==='flip'){const p=playing;playing=false;draw();playing=p;}
    draw();};
}
$('meta').textContent=D.dancers.length+'명 · 대형 '+D.steps.length+'개 · '+fmt(LAST);
addEventListener('resize',resize);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>draw());
// test hook: #t-<seconds> opens at that time
const h=/^#t-(\d+)$/.exec(location.hash);if(h)t=Math.min(LAST,h[1]*FPS);
resize();
</script>
